    <!-- Face: eyes -->
    <g fill="#831843">
      <circle cx="-7" cy="4" r="1.8"/>
      <circle cx="7" cy="4" r="1.8"/>
      <circle cx="-6.5" cy="3.5" r="0.6" fill="#FFF"/>
      <circle cx="7.5" cy="3.5" r="0.6" fill="#FFF"/>
    </g>
    <!-- Blush -->
    <ellipse cx="-13" cy="7" rx="2.5" ry="1.4" fill="#F9A8D4" opacity="0.7"/>
    <ellipse cx="13" cy="7" rx="2.5" ry="1.4" fill="#F9A8D4" opacity="0.7"/>
