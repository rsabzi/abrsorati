  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#FFF" stroke="#FBCFE8" stroke-width="1.5"/>
  <!-- Sparkles -->
  <g fill="#F9A8D4">
    <path d="M22 32 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5z"/>
    <path d="M78 32 l1.2 2.4 2.4 1.2 -2.4 1.2 -1.2 2.4 -1.2 -2.4 -2.4 -1.2 2.4 -1.2z"/>
    <circle cx="30" cy="42" r="1.4"/>
    <circle cx="72" cy="42" r="1.4"/>
  </g>
  <!-- Crown -->
  <g transform="translate(50 25)">
    <path d="M-11 8 L-11 -1 L-6 3 L-3 -6 L0 3 L3 -6 L6 3 L11 -1 L11 8 Z" fill="url(#crown)" stroke="#DB2777" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M-1.5 4 a1.5 1.3 0 0 1 3 0 c0 1 -1.5 2 -1.5 2 s-1.5 -1 -1.5 -2z" fill="#FFF"/>
    <circle cx="-6" cy="-3" r="1" fill="#FBCFE8"/>
    <circle cx="0" cy="-8" r="1" fill="#FBCFE8"/>
    <circle cx="6" cy="-3" r="1" fill="#FBCFE8"/>
  </g>
  <!-- Cloud body -->
  <g transform="translate(50 65)">
    <path d="M-26 4
             a10 10 0 0 1 6 -14
