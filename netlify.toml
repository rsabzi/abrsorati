[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback: unknown routes serve index.html, but /api/* is handled by the function via `config.path`.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/db/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
