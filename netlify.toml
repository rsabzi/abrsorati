[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# SPA fallback: unknown routes serve index.html, but /api/* is rewritten to the function path below.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/db/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
